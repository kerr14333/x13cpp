[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "x13cpp"
version = "0.0.0.dev0"
description = "Python interface to X13cpp, a C++ port of the U.S. Census Bureau's X-13ARIMA-SEATS seasonal adjustment program"
readme = "README.md"
requires-python = ">=3.9"
license = "CC0-1.0"
license-files = ["LICENSE"]
authors = [
    { name = "Chris", email = "cyg5005@gmail.com" },
]
keywords = ["seasonal adjustment", "time series", "x13", "x-13arima-seats", "census"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "numpy>=1.22",
]

[project.optional-dependencies]
pandas = ["pandas>=1.3"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/kerr14333/x13cpp"
Repository = "https://github.com/kerr14333/x13cpp"
Issues = "https://github.com/kerr14333/x13cpp/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"x13cpp" = ["py.typed"]
"x13cpp.datasets" = ["data/*.dat"]
